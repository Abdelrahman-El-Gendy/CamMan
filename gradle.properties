#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# 16KB Page Size Support for Android 15+
# Enables compatibility with devices that use 16KB memory pages
android.experimental.enableNewResourceShrinker.preciseShrinking=false

# Enable native library alignment for 16KB page sizes (AGP 8.5+)
# This ensures native libraries are properly aligned
android.bundle.enableUncompressedNativeLibs=true

#JDK - Set to Java 17 path (required for AGP 8.x)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

